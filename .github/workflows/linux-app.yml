name: Linux companion

on:
  push:
    branches: [main]
    paths: ['linux/**', 'src/Momentum4.Core*/**', 'src/Momentum4.Protocol/**', 'tests/Momentum4.Core*/**', 'tests/Momentum4.Protocol.Tests/**', 'Directory.*.props', 'global.json', '.github/workflows/linux-app.yml']
  pull_request:
    paths: ['linux/**', 'src/Momentum4.Core*/**', 'src/Momentum4.Protocol/**', 'tests/Momentum4.Core*/**', 'tests/Momentum4.Protocol.Tests/**', 'Directory.*.props', 'global.json', '.github/workflows/linux-app.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-dbus python3-gi gir1.2-glib-2.0 desktop-file-utils libegl1
          sudo /usr/bin/python3 -m pip install --break-system-packages 'PySide6==6.11.2'
      - name: Build self-contained shared core
        run: ./linux/build.sh
      - name: Shared core host tests
        run: |
          dotnet restore tests/Momentum4.CoreHost.Tests/Momentum4.CoreHost.Tests.csproj --configfile linux/NuGet.Config
          dotnet test --project tests/Momentum4.CoreHost.Tests/Momentum4.CoreHost.Tests.csproj --configuration Release --no-restore
      - name: Linux adapter, CLI, desktop and installer tests
        run: /usr/bin/python3 -m unittest discover -s linux/tests -v
      - name: Compile Python sources
        run: /usr/bin/python3 -m py_compile linux/momentum_control/*.py linux/install.py
      - name: Validate desktop entry and shell wrappers
        run: |
          desktop-file-validate linux/assets/momentum-control.desktop
          sh -n linux/build.sh linux/install.sh linux/uninstall.sh linux/package.sh
      - name: Pack release archive
        run: ./linux/package.sh ci "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-archive
          path: ${{ runner.temp }}/dist/*
          retention-days: 7

  # Installs the packed archive on plain distribution images with only the distribution's own packages.
  distro-install:
    name: Install archive (${{ matrix.image }})
    needs: linux-desktop
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            setup: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y python3-pyside6.qtcore python3-pyside6.qtgui python3-pyside6.qtwidgets python3-dbus python3-gi
          - image: debian:13
            setup: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y python3-pyside6.qtcore python3-pyside6.qtgui python3-pyside6.qtwidgets python3-dbus python3-gi
          - image: fedora:latest
            setup: dnf install -y tar gzip python3-pyside6 python3-dbus python3-gobject
          - image: archlinux:latest
            setup: pacman -Syu --noconfirm pyside6 python-dbus python-gobject
    steps:
      - name: Install distribution packages
        run: ${{ matrix.setup }}
      - uses: actions/download-artifact@v4
        with:
          name: linux-archive
      - name: Install, start and uninstall
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -eu
          tar -xzf Momentum4Control-ci-linux-x64.tar.gz
          cd momentum-control-linux-ci
          ./install.sh
          app="$HOME/.local/share/momentum4-control-linux"
          "$app/core/momentum-core-host" --version
          "$HOME/.local/bin/momentumctl" --help
          /usr/bin/python3 -c "import sys; sys.path.insert(0, sys.argv[1]); import momentum_control.gui" "$app"
          ./uninstall.sh
          test ! -e "$app"
