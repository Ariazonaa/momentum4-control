# Release: build the artifacts and attach them to a GitHub release.
#   - Momentum4Control-Setup-<ver>.exe          (Windows, Inno Setup installer, per-user)
#   - Momentum4Control-<ver>-portable.zip       (Windows, self-contained + portable marker)
#   - Momentum4Control-<ver>-linux-x64.tar.gz   (Linux companion with its self-contained shared core)
#   - Momentum4Control-<ver>-linux-arm64.tar.gz
#
# Triggers:
#   - tag v*            -> build + create a GitHub release with all files attached.
#   - workflow_dispatch -> build + upload as workflow artifacts only. Optional version input.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (empty = from Directory.Build.props)"
        required: false
        default: ""

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  package:
    name: setup.exe + portable
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build artifacts (setup.exe + portable.zip)
        shell: pwsh
        run: |
          $version = ''
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $version = $env:GITHUB_REF.Substring(11) }
          elseif ('${{ inputs.version }}') { $version = '${{ inputs.version }}' }
          $params = @{ Dist = "$env:GITHUB_WORKSPACE\dist" }
          if ($version) { $params['Version'] = $version }
          .\tools\make-release.ps1 @params
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem "$env:GITHUB_WORKSPACE\dist" | ForEach-Object { Get-FileHash $_.FullName -Algorithm SHA256 | Format-List Hash, Path }

      # The tray app has no visible window; setup has to end it itself or the upgrade fails on locked files.
      - name: Upgrade over a running app
        shell: pwsh
        run: |
          $setup = (Get-ChildItem "$env:GITHUB_WORKSPACE\dist\Momentum4Control-Setup-*.exe").FullName
          $app = "$env:LOCALAPPDATA\Programs\Momentum 4 Control\Momentum4Control.exe"
          $log = "$env:RUNNER_TEMP\setup.log"
          function Install {
            $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$log" -Wait -PassThru
            if ($p.ExitCode) { Get-Content $log -Tail 40; throw "Setup exit code $($p.ExitCode)." }
          }
          Install
          $old = Start-Process $app -ArgumentList '--minimized' -PassThru
          Start-Sleep 10
          if ($old.HasExited) { throw "The app did not stay running (exit code $($old.ExitCode))." }
          Install
          if (-not $old.HasExited) { throw 'Setup left the running app alive.' }
          Select-String -Path $log -Pattern 'taskkill|in use|Restart Manager' | Select-Object -First 10 | ForEach-Object Line

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Momentum4Control-dist
          path: dist/*
          retention-days: 30

  linux:
    name: Linux archive (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build and pack archive
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then version=${GITHUB_REF#refs/tags/v}
          elif [ -n "$INPUT_VERSION" ]; then version=$INPUT_VERSION
          else version=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)
          fi
          ./linux/build.sh "$version"
          ./linux/package.sh "$version" "$GITHUB_WORKSPACE/dist"
          sha256sum dist/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Momentum4Control-linux-${{ matrix.arch }}
          path: dist/*
          retention-days: 30

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Momentum4Control-*
          path: dist
          merge-multiple: true

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "MOMENTUM 4 Control $GITHUB_REF_NAME" \
            --notes "Windows installer (setup.exe) and portable ZIP, plus the Linux companion as tar.gz for x64 and arm64. Built by the release workflow."
